<svg viewBox="0 0 840 242" role="img" aria-label="Four nested horizons, year outside quarter outside week outside day, each deciding what the one inside it works on.">
<defs><marker id="ch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" class="dot"/></marker></defs>
<rect class="clock" x="0.5" y="0.5" width="839" height="51"/>
<text x="16.0" y="22.0" class="lab" text-anchor="start">THE YEAR</text>
<text x="16.0" y="40.0" text-anchor="start">runs on the metric catalog · definitions, the event contract, the loyalty joins</text>
<line class="ax" marker-end="url(#ch)" x1="780" y1="46" x2="780" y2="64"/>
<rect class="clock" x="34.5" y="62.5" width="771" height="51"/>
<text x="50.0" y="84.0" class="lab" text-anchor="start">THE QUARTER</text>
<text x="50.0" y="102.0" text-anchor="start">runs on the learning agenda · which questions are worth traffic at all</text>
<line class="ax" marker-end="url(#ch)" x1="746" y1="108" x2="746" y2="126"/>
<rect class="clock" x="68.5" y="124.5" width="703" height="51"/>
<text x="84.0" y="146.0" class="lab" text-anchor="start">THE WEEK</text>
<text x="84.0" y="164.0" text-anchor="start">runs on the sprint · readouts become decisions, tests get their plan</text>
<line class="ax" marker-end="url(#ch)" x1="712" y1="170" x2="712" y2="188"/>
<rect class="clock" x="102.5" y="186.5" width="635" height="51"/>
<text x="118.0" y="208.0" class="lab" text-anchor="start">THE DAY</text>
<text x="118.0" y="226.0" text-anchor="start">runs on the health check and the standup · catch breakage before it is acted on</text>
</svg>
